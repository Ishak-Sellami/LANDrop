[package]
name = "landrop-desktop"
version = "0.1.0"
description = "LanDrop Desktop foundation"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "landrop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.0.5", features = [] }

[dependencies]
tauri = { version = "=2.2.5", features = [] }
tauri-runtime = "=2.3.0"
tauri-runtime-wry = "=2.3.0"
tauri-utils = "=2.1.1"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
